{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="dashboard-card">

        <h2 class="mb-4">
            Class-wise Student Strength
        </h2>

        <form method="GET"
              action="/vv-report-category/class-strength">

            <!-- Academic Year -->
            
            <div class="mb-3">

                <label class="form-label fw-bold">
                    Academic Year
                </label>

                <select
                    name="year"
                    class="form-select">

                    <option value="2026-2027"
                        {% if academic_year == "2026-2027" %}selected{% endif %}>
                        2026-27
                    </option>

                    <option value="2025-2026"
                        {% if academic_year == "2025-2026" %}selected{% endif %}>
                        2025-26
                    </option>

                    <option value="2024-2025"
                        {% if academic_year == "2024-2025" %}selected{% endif %}>
                        2024-25
                    </option>

                </select>

</div>

            <div class="mb-4">

                <label class="form-label fw-bold">
                    Centre
                </label>

                <select
                    name="center_id"
                    class="form-select">

                    {% for centre in centres %}

                        <option value="{{ centre.center_id }}">

                            {{ centre.center_name }}

                        </option>

                    {% endfor %}

                </select>

            </div>

            <button
                type="submit"
                class="btn btn-primary">

                Generate Report

            </button>

        </form>

    </div>

</div>

{% endblock %}
