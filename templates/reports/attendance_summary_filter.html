{% extends "base.html" %}

{% block content %}

<div class="container mt-4">


    <h3 class="section-title mb-4">
        Centre-wise Monthly Attendance Summary
    </h3>

    <form method="GET"
          action="/vv-report-category/attendance-summary">

        <div class="mb-3">

            <label class="form-label fw-bold">
                Academic Year
            </label>

            <select
                name="year"
                class="form-select">

                <option value="2026-2027">2026-2027</option>
                <option value="2025-2026" selected>2025-26</option>
                <option value="2024-2025">2024-25</option>

            </select>

        </div>

        <div class="mb-3">

            <label class="form-label fw-bold">
                Attendance Month
            </label>

            <input
                type="month"
                name="attendance_month"
                class="form-control"
                required>

        </div>

        <button
            class="btn btn-primary"
            type="submit">

            Generate Attendance Report

        </button>

    </form>

</div>

{% endblock %}
