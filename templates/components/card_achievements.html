
<div class="dashboard-card">

    <div class="dashboard-header">
        <i class="bi bi-star-fill me-2"></i>
        Achievements
    </div>

    <div class="card-body">

        <div class="info-row">
            <div class="info-label">Achievement Count</div>
            <div class="info-value">{{ student.achievement_count }}</div>
        </div>

        <div class="info-row">
            <div class="info-label">Achievements</div>
            <div class="info-value">{{ student.achievements }}</div>
        </div>

        <div class="info-row">
            <div class="info-label">Latest Achievement</div>
            <div class="info-value">
                {{ student.latest_achievement_date }}
            </div>
        </div>

    </div>

</div>
