<div class="dashboard-card">

    <div class="dashboard-header">
        <i class="bi bi-mortarboard-fill me-2"></i>
        Higher Education
    </div>

    <div class="card-body">

        <div class="info-row">
            <div class="info-label">Qualification</div>
            <div class="info-value">{{ student.highest_qualification }}</div>
        </div>

        <div class="info-row">
            <div class="info-label">Course</div>
            <div class="info-value">{{ student.highest_course }}</div>
        </div>

        <div class="info-row">
            <div class="info-label">Specialization</div>
            <div class="info-value">{{ student.highest_specialization }}</div>
        </div>

        <div class="info-row">
            <div class="info-label">Institution</div>
            <div class="info-value">{{ student.highest_institution }}</div>
        </div>

        <div class="info-row">
            <div class="info-label">Status</div>
            <div class="info-value">{{ student.highest_education_status }}</div>
        </div>

    </div>

</div>
