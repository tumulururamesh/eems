<!-- ==========================================================
     KPI DASHBOARD
========================================================== -->

<div class="row">

    <!-- Awards -->

    <div class="col-lg-3 col-md-6 mb-4">

        <div class="kpi-card">

            <div class="kpi-icon">
                <i class="bi bi-trophy-fill"></i>
            </div>

            <div class="kpi-title">
                Awards
            </div>

            <div class="kpi-value">
                {{ student.award_count or 0 }}
            </div>

        </div>

    </div>

    <!-- Achievements -->

    <div class="col-lg-3 col-md-6 mb-4">

        <div class="kpi-card">

            <div class="kpi-icon">
                <i class="bi bi-star-fill"></i>
            </div>

            <div class="kpi-title">
                Achievements
            </div>

            <div class="kpi-value">
                {{ student.achievement_count or 0 }}
            </div>

        </div>

    </div>

    <!-- Education -->

    <div class="col-lg-3 col-md-6 mb-4">

        <div class="kpi-card">

            <div class="kpi-icon">
                <i class="bi bi-mortarboard-fill"></i>
            </div>

            <div class="kpi-title">
                Education
            </div>

            <div class="kpi-text">
                {{ student.highest_qualification }}
            </div>

        </div>

    </div>

    <!-- Current Stage -->

    <div class="col-lg-3 col-md-6 mb-4">

        <div class="kpi-card">

            <div class="kpi-icon">
                <i class="bi bi-briefcase-fill"></i>
            </div>

            <div class="kpi-title">
                Current Stage
            </div>

            <div class="kpi-text">
                {{ student.current_stage }}
            </div>

        </div>

    </div>

</div>
