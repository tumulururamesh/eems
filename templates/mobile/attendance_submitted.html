
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Attendance Submitted</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f7fa;
        }

        .confirmation-container {
            max-width: 520px;
            margin: auto;
            padding: 48px 24px;
        }

        .success-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #198754;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            margin: 0 auto 20px;
        }

        .confirmation-title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .centre-code {
            text-align: center;
            font-size: 21px;
            font-weight: 700;
            margin-top: 24px;
        }

        .attendance-date {
            text-align: center;
            color: #6c757d;
            margin-top: 4px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            overflow: hidden;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 16px 18px;
            border-bottom: 1px solid #e5e7eb;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-label {
            color: #6c757d;
        }

        .summary-value {
            font-weight: 700;
        }

        .submitted-time {
            text-align: center;
            color: #6c757d;
            font-size: 14px;
            margin-top: 22px;
        }

        .back-button {
            margin-top: 30px;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
        }

    </style>

</head>

<body>

<div class="confirmation-container">

    <div class="success-icon">
        ✓
    </div>

    <div class="confirmation-title">
        Attendance Submitted
    </div>

    <div class="centre-code">
        {{ submission.center_code }}
    </div>

    <div class="attendance-date">
        {{ submission.attendance_date.strftime('%d %B %Y') }}
    </div>

    <div class="summary-card">

        <div class="summary-row">
            <div class="summary-label">
                Total Students
            </div>

            <div class="summary-value">
                {{ summary.total_students }}
            </div>
        </div>

        <div class="summary-row">
            <div class="summary-label">
                Present
            </div>

            <div class="summary-value">
                {{ summary.present }}
            </div>
        </div>

        <div class="summary-row">
            <div class="summary-label">
                Absent
            </div>

            <div class="summary-value">
                {{ summary.absent }}
            </div>
        </div>

    </div>

    <div class="submitted-time">
        Submitted at
        {{ submission.submitted_at.strftime('%I:%M %p') }}
    </div>

    <a href="/mobile/attendance"
       class="btn btn-primary back-button">
        Back to Centres
    </a>

</div>

</body>

</html>
